name: Code Tests
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1-5'
  push:

permissions: {}

jobs:
  bats:
    if: ${{ ( github.event_name == 'schedule' && github.event.repository.fork == false ) || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        slackware-version: ['15.0', 'current']
    container:
      image: aclemons/slackware:${{ matrix.slackware-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize slackpkg
        run: |
          sed -i "s|WGETFLAGS=\"--passive-ftp\"|WGETFLAGS=\"--passive-ftp --quiet\"|" /etc/slackpkg/slackpkg.conf
          echo "YES" | slackpkg update gpg
          slackpkg update

      - name: Set up global certificates
        run: |
          slackpkg install dcron ca-certificates perl
          update-ca-certificates
          cd /etc/ssl/certs && c_rehash .

      - name: Install test dependencies
        run: |
          slackpkg install texinfo lzip
          # Runtime dependencies of kcov that aren't part of the base image.
          # nghttp3 and ngtcp2 only exist in -current, slackpkg skips them on 15.0
          slackpkg install elfutils brotli cyrus-sasl nghttp2 nghttp3 ngtcp2

      - name: Install bats and kcov
        run: |
          wget --quiet https://repo.liwjatan.org/pprkut/${{ matrix.slackware-version }}/x86_64/PACKAGES.TXT
          wget --quiet https://repo.liwjatan.org/pprkut/${{ matrix.slackware-version }}/x86_64/bats-core/$(grep "PACKAGE NAME:  bats-core" PACKAGES.TXT | cut -d " " -f 4)
          wget --quiet https://repo.liwjatan.org/pprkut/${{ matrix.slackware-version }}/x86_64/bats-support/$(grep "PACKAGE NAME:  bats-support" PACKAGES.TXT | cut -d " " -f 4)
          wget --quiet https://repo.liwjatan.org/pprkut/${{ matrix.slackware-version }}/x86_64/bats-assert/$(grep "PACKAGE NAME:  bats-assert" PACKAGES.TXT | cut -d " " -f 4)
          wget --quiet https://repo.liwjatan.org/pprkut/${{ matrix.slackware-version }}/x86_64/bats-file/$(grep "PACKAGE NAME:  bats-file" PACKAGES.TXT | cut -d " " -f 4)
          wget --quiet https://repo.liwjatan.org/pprkut/${{ matrix.slackware-version }}/x86_64/kcov/$(grep "PACKAGE NAME:  kcov" PACKAGES.TXT | cut -d " " -f 4)
          installpkg --terse *.txz

      - name: Create lintpkg user
        run: useradd -m lintpkg

      - name: Create build directory
        run: |
          mkdir build
          chown lintpkg build

      - name: Run bats
        run: su lintpkg -c './tests/run --coverage --junit'

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.slackware-version }}
          path: build/junit/report.xml
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.slackware-version }}
          path: build/coverage/bats/cobertura.xml
          if-no-files-found: error

  codecov:
    needs: bats
    # Also upload the test results of failed test runs
    if: ${{ !cancelled() && needs.bats.result != 'skipped' }}
    runs-on: ubuntu-latest
    # Show a failed upload, but don't fail the workflow run because of it
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        slackware-version: ['15.0', 'current']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: junit-${{ matrix.slackware-version }}
          path: build/junit

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: build/junit/report.xml
          disable_search: true
          flags: slackware-${{ matrix.slackware-version }}
          # Pull requests from forks can't get an OIDC token and fall back to
          # tokenless uploads, which Codecov allows for public repositories
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          fail_ci_if_error: true

      - name: Download coverage report
        if: ${{ needs.bats.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-${{ matrix.slackware-version }}
          path: build/coverage

      - name: Upload coverage to Codecov
        if: ${{ needs.bats.result == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage/cobertura.xml
          disable_search: true
          flags: slackware-${{ matrix.slackware-version }}
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          fail_ci_if_error: true
