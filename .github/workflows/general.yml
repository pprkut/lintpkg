name: General Tests
on: [push, pull_request, workflow_dispatch]

permissions: {}

jobs:
  typos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: false
    name: "Spellcheck (typos)"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: typos-action
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  reuse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "REUSE compliance"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "GitHub Actions analysis (zizmor)"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  editorconfig:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "EditorConfig compliance"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0

      - name: Check files
        run: git ls-files --exclude-standard -z | xargs -0 editorconfig-checker

  shfmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "Shell formatting (shfmt)"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shfmt
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: shfmt@3.14.1
          fallback: none

      - name: Check formatting
        run: shfmt --diff .

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "Shell analysis (shellcheck)"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck and shfmt
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: shellcheck@0.11.0,shfmt@3.14.1
          fallback: none

      # shfmt lists the shell scripts, leaving out the files .editorconfig
      # excludes from formatting:
      - name: Check shell scripts
        run: shfmt -f . | xargs -d '\n' shellcheck
